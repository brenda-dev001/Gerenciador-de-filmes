<!doctype html>
<html lang="PT-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/imagens/icons/ChatGPT Image 25_07_2026, 00_43_55.png" type="image/x-icon">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/modal.css" />
    <link rel="stylesheet" href="/styles/media-1300.css" media="(max-width: 1300px)" />
    <link rel="stylesheet" href="/styles/media-920.css" media="(max-width: 920px)"/>
    <link rel="stylesheet" href="/styles/media-750.css" media="(max-width: 750px)"/>
    <link rel="stylesheet" href="/styles/media-560.css" media="(max-width: 560px)">
    <link rel="stylesheet" href="/styles/media-430.css" media="(max-width: 430px)">
    <link rel="stylesheet" href="https://unpkg.com/notie/dist/notie.min.css" /> 
    <title>Movie List</title>
  </head>
  <body>
    <header class="cabecalho">
      <div class="cabecalho__conteudo">
        <div class="cabecalho__titulo">
          <div><i class="bi bi-film"></i></div>
          <div>
            <h1>my movies</h1>
          </div>
        </div>
        <nav class="navegacao">
          <div class="navegacao__conteudo">
            <div class="navegacao__campo">
              <label class="navegacao__label" for="nome_filme">Nome</label>
              <input class="navegacao__input" type="text" id="nome_filme"/>
            </div>
            <div class="navegacao__campo">
              <label class="navegacao__label" for="ano">Ano</label>
              <input type="text" id="ano" class="navegacao__input navegacao__input--ano"/>
            </div>
            <div class="navegacao__campo navegacao__acao">
              <button class="navegacao__botao" id="botao_buscar"><i class="bi bi-search"></i></button>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main>
      <h2 id="main__titulo-principal">Comece agora sua lista de filmes!</h2>
      <article class="lista-filmes">
      </article>
      <article>
        <div class="filme-modal filme-modal--oculto"> 
          <div class="filme-modal__cabecalho">
            <h2 class="filme-modal__titulo" id="titulo_filme">Avatar: Fire and Ash</h2>
            <button class="filme-modal__fechar" id="fechar_modal"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="filme-modal__conteudo">
            <div class="filme-modal__poster">
              <img
                class="filme-modal__imagem" id="poster_filme"
                src=""
                alt="imagem do filme"
              />
            </div>
            <div class="filme-modal__detalhes">
              <div>
                <h2>Resumo:</h2>
                <strong class="filme-modal__texto" id="resumo_filme">
                  <!-- Jake and Neytiri's family grapples with grief, encountering a
                  new, aggressive Na'vi tribe, the Ash People, who are led by
                  the fiery Varang, as the conflict on Pandora escalates and a
                  new moral focus emerges. -->
                </strong>
              </div>
              <div>
                <h2>Elenco:</h2>
                <strong class="filme-modal__texto" id="elenco_filme">
                  <!-- Sam Worthington, Zoe, Sigourney Weaver -->
                  </strong>
              </div>
              <div>
                <h2>Gênero:</h2>
                <strong class="filme-modal__texto" id="genero_filme">
                  <!-- Action, Adventure, Fantasy -->
                </strong>
              </div>
            </div>
          </div>
          <button class="filme-modal__adicionar" id="add_filme">Adicionar filme</button>
        </div>
      </article>
    </main>
    <!-- <footer>
      <div>
        <a href="#">Politica de privacidade</a>
      </div>
    </footer> -->
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/scripts/entradas.js"></script>
    <script src="https://unpkg.com/notie"></script>
    <script type="module" src="/scripts/modal.js"></script>
    <script src="/scripts/key.js"></script>
    <script type="module" src="/scripts/listaFilmes.js"></script>
  </body>
</html>
